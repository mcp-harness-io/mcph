[project]
name = "mcph"
version = "0.1.0"
description = "MCP Harness: diagnostics, real-client proxy and LLM-as-a-judge evals for MCP servers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Libor Krzyzanek", email = "libor.krzyzanek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp-slim[client]>=4.2,<5",
    "httpx2>=2.10.0",
    "platformdirs>=4.0",
    "py-key-value-aio[filetree]>=0.4.6,<0.6",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "typer>=0.16.0",
]

[project.scripts]
mcph = "mcph.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastmcp-slim[server]>=4.2,<5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcph --cov-report=term-missing --cov-fail-under=90"
markers = ["e2e: starts real MCP server subprocesses (slower)"]

[tool.coverage.run]
relative_files = true
