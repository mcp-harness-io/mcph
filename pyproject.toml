[project]
name = "mcph"
version = "0.0.2"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Libor Krzyzanek", email = "libor.krzyzanek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "typer>=0.15.0",
]

[project.scripts]
mcph = "mcph.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcph --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
relative_files = true
